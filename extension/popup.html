<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misinformation Detector</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 12px;
        width: 320px;
        color: #1f2937;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 10px;
      }

      button {
        width: 100%;
        padding: 8px 10px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        background: #93c5fd;
        cursor: wait;
      }

      .meta,
      .result,
      .error {
        margin-top: 12px;
        font-size: 13px;
      }

      .result p,
      .meta p {
        margin: 6px 0;
      }

      .label {
        font-weight: 700;
      }

      .error {
        color: #b91c1c;
      }

      .muted {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>Misinformation Detector</h1>
    <button id="analyzeBtn">Analyze Current Page</button>

    <div class="meta">
      <p class="muted" id="status">Click analyze to scan this page.</p>
    </div>

    <div class="result" id="result" hidden>
      <p><span class="label">Prediction:</span> <span id="prediction">-</span></p>
      <p><span class="label">Confidence:</span> <span id="confidence">-</span></p>
      <p><span class="label">Explanation:</span> <span id="explanation">-</span></p>
      <p><span class="label">Evidence:</span><pre id="evidence"></pre></p>
    </div>

    <div class="error" id="error" hidden></div>

    <script src="popup.js"></script>
  </body>
</html>
